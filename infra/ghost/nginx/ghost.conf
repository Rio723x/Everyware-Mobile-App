# Everyware Ghost CMS - reverse proxy vhost.
#
# Lives at /home/rumblejack/services/nginx/conf.d/ghost.conf.
#
# Reload nginx ONLY after the certificate exists. nginx refuses to start if
# ssl_certificate points at a missing file, and this box also serves git, chat
# and api-dev - a bad reload takes all three down with it. Always:
#
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# The cert was issued with certbot standalone, matching the other four certs on
# this host. Standalone binds port 80 itself, so RENEWAL REQUIRES NGINX STOPPED:
#
#   docker stop nginx && sudo certbot renew && docker start nginx
#
# That is a pre-existing property of every cert on this box, not specific to
# Ghost. Moving them all to webroot would make renewal hands-off.

server {
    listen 80;
    server_name cms.everyware.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cms.everyware.in;

    ssl_certificate     /etc/letsencrypt/live/cms.everyware.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.everyware.in/privkey.pem;

    # Ghost accepts image and theme uploads through the admin UI.
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s;

    # ── De-indexing ──────────────────────────────────────────────────────
    # Ghost renders a complete public site of its own here. Left indexable it
    # would compete with everyware.in/blog for identical content and split the
    # ranking signal across two URLs. These two rules are what spec 01 D4
    # requires, and what its definition-of-done curl checks assert.
    #
    # This is done at the proxy rather than via Ghost's "make this site
    # private" setting, because that setting also gates the Content API the
    # blog build reads.

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        set $backend http://ghost:2368;
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
