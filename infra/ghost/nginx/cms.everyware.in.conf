# Everyware Ghost CMS - reverse proxy vhost.
#
# Copy to /home/rumblejack/services/nginx/conf.d/ and reload nginx ONLY after
# the certificate exists. nginx refuses to start if ssl_certificate points at a
# missing file, and this box also serves git, chat and api-dev - a bad reload
# takes all three down with it. Always:
#
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# Issue the cert first:
#   sudo certbot certonly --webroot -w /var/www/certbot -d cms.everyware.in

server {
    listen 80;
    server_name cms.everyware.in;

    # Leave the ACME path reachable over plain HTTP so renewals keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cms.everyware.in;

    ssl_certificate     /etc/letsencrypt/live/cms.everyware.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.everyware.in/privkey.pem;

    # Ghost accepts image and theme uploads through the admin UI.
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s;

    # ── De-indexing ──────────────────────────────────────────────────────
    # Ghost renders a complete public site of its own here. Left indexable it
    # would compete with everyware.in/blog for identical content and split the
    # ranking signal across two URLs. These two rules are what spec 01 D4
    # requires, and what its definition-of-done curl checks assert.
    #
    # This is done at the proxy rather than via Ghost's "make this site
    # private" setting, because that setting also gates the Content API the
    # blog build reads.

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        set $backend http://ghost:2368;
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
