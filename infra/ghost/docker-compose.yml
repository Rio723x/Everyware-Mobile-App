# Everyware Ghost CMS - self-hosted, headless.
#
# Deployed onto the existing fixolutions services VM, which already runs an
# nginx reverse proxy on the `proxy` network with certbot and /etc/letsencrypt
# mounted. Ghost therefore publishes NO host ports: nginx reaches it by
# container name over that network, exactly as gitea and mattermost do.
#
#   cp .env.example .env   # then fill in the passwords
#   docker compose up -d
#
# TLS, the HTTP->HTTPS redirect and the de-indexing rules all live in
# nginx/cms.everyware.in.conf, not here.

services:
  ghost:
    image: ghost:5-alpine
    container_name: ghost
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Must be the public origin. Ghost writes this into every URL the Content
      # API returns, so getting it wrong poisons every canonical downstream.
      url: ${GHOST_PUBLIC_URL}
      NODE_ENV: production
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__port: 3306
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ghost
      # nginx terminates TLS and forwards the original scheme.
      server__host: 0.0.0.0
      server__port: 2368
    volumes:
      - ghost-content:/var/lib/ghost/content
    networks:
      - proxy
      - ghost-internal
    # This box also runs production Supabase with no swap configured. A hard
    # ceiling means a Ghost leak or spike cannot get supabase-db picked by the
    # OOM killer - the container dies alone and restarts.
    mem_limit: 512m
    mem_reservation: 256m

  db:
    image: mysql:8.0
    container_name: ghost-db
    restart: unless-stopped
    command:
      # MySQL's defaults assume it owns the machine. It does not: this trims
      # roughly 400MB of resident memory that would otherwise sit unused.
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=8M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      # Deliberately NOT on `proxy`: the database has no reason to be reachable
      # from the reverse proxy or anything else sharing that network.
      - ghost-internal
    healthcheck:
      # Ghost crashes on boot if it reaches MySQL before it accepts
      # connections, so the dependency gates on this rather than on start.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 640m
    mem_reservation: 320m

networks:
  # Created and owned by the existing nginx stack on this host.
  proxy:
    external: true
  ghost-internal:
    driver: bridge

volumes:
  ghost-content:
  db-data:
