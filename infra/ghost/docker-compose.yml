# Everyware Ghost CMS - self-hosted, headless.
#
# Three containers: Ghost, its MySQL database, and Caddy in front for automatic
# TLS. Caddy also carries the de-indexing rules, so Ghost's own frontend can
# never compete with everyware.in/blog for the same content.
#
#   cp .env.example .env   # then fill in the passwords
#   docker compose up -d
#
# Ghost is MIT-licensed and this is the full deployment. There is nothing here
# that the hosted plan does differently: same Content API, same Admin API, same
# webhooks.

services:
  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Must match the public origin exactly, or Ghost writes wrong URLs into
      # the Content API responses and every canonical downstream inherits them.
      url: ${GHOST_PUBLIC_URL}
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__port: 3306
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ghost
      # Optional outbound mail for staff invites and password resets.
      mail__transport: SMTP
      mail__options__service: ${MAIL_SERVICE:-}
      mail__options__auth__user: ${MAIL_USER:-}
      mail__options__auth__pass: ${MAIL_PASSWORD:-}
    volumes:
      - ghost-content:/var/lib/ghost/content
    expose:
      - "2368"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Ghost crashes on boot if it reaches MySQL before it is accepting
      # connections, so the dependency is gated on this rather than on start.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - ghost
    ports:
      - "80:80"
      - "443:443"
    environment:
      GHOST_DOMAIN: ${GHOST_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ghost-content:
  db-data:
  caddy-data:
  caddy-config:
